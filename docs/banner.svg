<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">claude-code-handoff</title>
  <desc id="desc">One Claude Code session moving between Anthropic, OpenRouter and a local model, in both directions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141a"/>
      <stop offset="1" stop-color="#171b23"/>
    </linearGradient>
    <linearGradient id="thread" gradientUnits="userSpaceOnUse" x1="244" y1="0" x2="546" y2="0">
      <stop offset="0" stop-color="#f0a35e"/>
      <stop offset="1" stop-color="#e8c26a"/>
    </linearGradient>
    <linearGradient id="thread2" gradientUnits="userSpaceOnUse" x1="734" y1="0" x2="1036" y2="0">
      <stop offset="0" stop-color="#e8c26a"/>
      <stop offset="1" stop-color="#64c8b4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="72" y="104" fill="#f3f4f6" font-size="50" font-weight="700" letter-spacing="-0.5">claude-code-handoff</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="74" y="148" fill="#a7adb8" font-size="23">Run Claude Code on OpenRouter, a local model or Anthropic.</text>
    <text x="74" y="180" fill="#a7adb8" font-size="23">Resume the same session on any of them, in both directions.</text>
  </g>

  <!-- one session, served turn by turn by different providers -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M244 300 H546" stroke="url(#thread)"/>
    <path d="M734 300 H1036" stroke="url(#thread2)"/>
    <path d="M256 290 L244 300 L256 310" stroke="#f0a35e"/>
    <path d="M534 290 L546 300 L534 310" stroke="#e8c26a"/>
    <path d="M746 290 L734 300 L746 310" stroke="#e8c26a"/>
    <path d="M1024 290 L1036 300 L1024 310" stroke="#64c8b4"/>
  </g>
  <g>
    <circle cx="310" cy="300" r="6" fill="#f0a35e"/>
    <circle cx="362" cy="300" r="6" fill="#f0a35e"/>
    <circle cx="428" cy="300" r="6" fill="#e8c26a"/>
    <circle cx="480" cy="300" r="6" fill="#e8c26a"/>
    <circle cx="800" cy="300" r="6" fill="#e8c26a"/>
    <circle cx="852" cy="300" r="6" fill="#e8c26a"/>
    <circle cx="918" cy="300" r="6" fill="#64c8b4"/>
    <circle cx="970" cy="300" r="6" fill="#64c8b4"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <g>
      <rect x="70" y="270" width="160" height="60" rx="12" fill="#1d222c" stroke="#f0a35e" stroke-width="2"/>
      <text x="150" y="307" fill="#f3f4f6">Anthropic</text>
    </g>
    <g>
      <rect x="560" y="270" width="160" height="60" rx="12" fill="#1d222c" stroke="#e8c26a" stroke-width="2"/>
      <text x="640" y="307" fill="#f3f4f6">OpenRouter</text>
    </g>
    <g>
      <rect x="1050" y="270" width="160" height="60" rx="12" fill="#1d222c" stroke="#64c8b4" stroke-width="2"/>
      <text x="1130" y="307" fill="#f3f4f6">local model</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#7d8594" text-anchor="middle">
    <text x="395" y="350">--resume</text>
    <text x="885" y="350">--resume</text>
  </g>
</svg>
